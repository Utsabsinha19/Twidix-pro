ch itself into their nervous systems.",emotion:"intimacy",emotionalResonance:98,heartRateSignature:"74 BPM",author:"Julian Thorne",relation:"Grandfather",audioDuration:"03:12",tags:["Music","Farewells","Marseille","Silence"]},{id:"mem-3",title:"Midnight Cartography",subtitle:"Reading maps of forgotten merchant routes by bedside lamp.",date:"November 03, 1991",era:"Early 1990s",location:"Edinburgh, Scotland",category:"artifact",imageUrl:"https://images.pexels.com/photos/10387562/pexels-photo-10387562.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",narrative:'He would wake me up just after the floorboards settled. "Look at the ink," he would whisper. We traced the old sea paths where our ancestors once transported wool and salt. In those hours, the ceiling disappeared, replaced by infinite constellations of human curiosity.',emotion:"wonder",emotionalResonance:89,heartRateSignature:"58 BPM",author:"Arthur Pendelton",relation:"Great-Uncle",tags:["Childhood","Maps","Lineage","Whispers"]},{id:"mem-4",title:"The Eve of the Great Crossing",subtitle:"Two minds looking toward an unwritten horizon.",date:"May 11, 1956",era:"1950s",location:"Bremerhaven, Germany",category:"letter",imageUrl:"https://images.pexels.com/photos/6041623/pexels-photo-6041623.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",narrative:'Found tucked inside a leather-bound copy of Rilke. The paper still holds the faint aroma of dried lavender and engine oil. "We carry nothing but our names and the rhythm of our mother tongue," she wrote on the final evening before the steamer departed.',emotion:"legacy",emotionalResonance:91,author:"Clara Mendel",relation:"Great-Grandmother",tags:["Letters","Transatlantic","Courage"]},{id:"mem-5",title:"Letters from the Adriatic Coast",subtitle:"Faded ink capturing the scent of salt and pine forests.",date:"July 29, 1983",era:"1980s",location:"Dubrovnik, Croatia",category:"polaroid",imageUrl:"https://images.pexels.com/photos/4115552/pexels-photo-4115552.jpeg?a
